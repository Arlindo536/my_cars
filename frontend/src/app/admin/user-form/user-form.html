<div class="d-flex justify-content-center align-items-center py-5" style="min-height: 70vh;">
  <div class="card shadow-sm p-4" style="width: 100%; max-width: 440px;">
    <h1 class="h2 mb-4 text-center">{{ 'users.editTitle' | translate }}</h1>
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="uf-username" class="form-label">{{ 'auth.username' | translate }}</label>
        <input id="uf-username" formControlName="username" type="text" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="uf-email" class="form-label">{{ 'auth.email' | translate }}</label>
        <input id="uf-email" formControlName="email" type="email" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="uf-first" class="form-label">{{ 'auth.firstName' | translate }}</label>
        <input id="uf-first" formControlName="first_name" type="text" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="uf-last" class="form-label">{{ 'auth.lastName' | translate }}</label>
        <input id="uf-last" formControlName="last_name" type="text" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="uf-role" class="form-label">{{ 'users.role' | translate }}</label>
        <select id="uf-role" formControlName="role" class="form-select">
          <option value="customer">{{ 'users.roleCustomer' | translate }}</option>
          <option value="admin">{{ 'users.roleAdmin' | translate }}</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="userForm.invalid">{{ 'profile.save' | translate }}</button>
    </form>
    <a routerLink="/admin/users" class="btn btn-link w-100 mt-2">{{ 'users.back' | translate }}</a>
  </div>
</div>
