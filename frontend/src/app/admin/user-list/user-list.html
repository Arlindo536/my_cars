<div style="background-color: #f8f9fa; min-height: 85vh;" class="py-5">
  <div class="container">
    <div class="card shadow p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">All Users</h2>
        <a routerLink="/admin/users/new" class="btn btn-success">
          <i class="material-icons" style="font-size: 16px; vertical-align: middle;">add</i> Add User
        </a>
      </div>

      <div class="mb-4">
        <input
          type="text"
          class="form-control"
          placeholder="Search by username..."
          [(ngModel)]="searchTerm"
          (keyup.enter)="onSearch()"
        />
      </div>

      <div *ngIf="users.length === 0" class="text-center text-muted py-5">
        <p style="font-size: 3rem;">👤</p>
        <p>No users found.</p>
      </div>

      <div *ngIf="users.length > 0">
        <div class="d-flex justify-content-end align-items-center mb-2 gap-2">
          <button class="btn btn-outline-danger btn-sm" *ngIf="selectMode && selectedIds.length > 0" (click)="deleteSelected()">
            <i class="material-icons" style="font-size: 16px; vertical-align: middle;">delete</i>
            Delete Selected ({{ selectedIds.length }})
          </button>
          <button class="btn btn-outline-secondary btn-sm" (click)="toggleSelectMode()">
            {{ selectMode ? 'Cancel' : 'Select' }}
          </button>
        </div>

        <h5 class="text-primary mb-3">
          <i class="material-icons" style="font-size: 18px; vertical-align: middle;">admin_panel_settings</i>
          Admins
        </h5>
        <div class="table-responsive">
          <table class="table table-striped mb-4">
            <thead>
              <tr>
                <th *ngIf="selectMode"></th>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let user of admins">
                <td *ngIf="selectMode">
                  <input
                    type="checkbox"
                    [checked]="selectedIds.includes(user.id)"
                    (change)="toggleSelect(user.id, $event)"
                  />
                </td>
                <td>{{ user.id }}</td>
                <td><a [routerLink]="['/admin/users', user.id]">{{ user.username }}</a></td>
                <td>{{ user.email }}</td>
              </tr>
            </tbody>
          </table>
        </div>

        <h5 class="text-secondary mb-3">
          <i class="material-icons" style="font-size: 18px; vertical-align: middle;">people</i>
          Customers
        </h5>
        <div class="table-responsive">
          <table class="table table-striped mb-0">
            <thead>
              <tr>
                <th *ngIf="selectMode"></th>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let user of customers">
                <td *ngIf="selectMode">
                  <input
                    type="checkbox"
                    [checked]="selectedIds.includes(user.id)"
                    (change)="toggleSelect(user.id, $event)"
                  />
                </td>
                <td>{{ user.id }}</td>
                <td><a [routerLink]="['/admin/users', user.id]">{{ user.username }}</a></td>
                <td>{{ user.email }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="d-flex justify-content-center align-items-center mt-3 gap-2" *ngIf="users.length > 0">
        <button class="btn btn-outline-secondary btn-sm" [disabled]="!hasPrevious || isLoading" (click)="previousPage()">
          <i class="material-icons" style="font-size: 16px; vertical-align: middle;">chevron_left</i>
        </button>
        <button
          *ngFor="let page of pageNumbers"
          class="btn btn-sm"
          [class.btn-primary]="page === currentPage"
          [class.btn-outline-secondary]="page !== currentPage"
          [disabled]="isLoading"
          (click)="goToPage(page)">
          {{ page }}
        </button>
        <button class="btn btn-outline-secondary btn-sm" [disabled]="!hasNext || isLoading" (click)="nextPage()">
          <i class="material-icons" style="font-size: 16px; vertical-align: middle;">chevron_right</i>
        </button>
      </div>
    </div>
  </div>
</div>
