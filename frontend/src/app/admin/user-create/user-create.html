<div class="d-flex justify-content-center align-items-center py-5" style="min-height: 70vh;">
  <div class="card shadow-sm p-4" style="width: 100%; max-width: 440px;">
    <h1 class="h2 mb-4 text-center">{{ 'users.createTitle' | translate }}</h1>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="uc-username" class="form-label">{{ 'auth.username' | translate }}</label>
        <input id="uc-username" formControlName="username" type="text" class="form-control" autocomplete="off" />
      </div>
      <div class="mb-3">
        <label for="uc-password" class="form-label">{{ 'auth.password' | translate }}</label>
        <input id="uc-password" formControlName="password" type="password" class="form-control" autocomplete="new-password" />
      </div>
      <div class="mb-3">
        <label for="uc-confirm" class="form-label">{{ 'auth.confirmPassword' | translate }}</label>
        <input id="uc-confirm" formControlName="confirm_password" type="password" class="form-control" autocomplete="new-password" />
      </div>
      <div class="mb-3">
        <label for="uc-email" class="form-label">{{ 'auth.email' | translate }}</label>
        <input id="uc-email" formControlName="email" type="email" class="form-control" autocomplete="off" />
      </div>
      <div class="mb-3">
        <label for="uc-first" class="form-label">{{ 'auth.firstName' | translate }}</label>
        <input id="uc-first" formControlName="first_name" type="text" class="form-control" autocomplete="off" />
      </div>
      <div class="mb-3">
        <label for="uc-last" class="form-label">{{ 'auth.lastName' | translate }}</label>
        <input id="uc-last" formControlName="last_name" type="text" class="form-control" autocomplete="off" />
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid">{{ 'users.create' | translate }}</button>
    </form>
    <a routerLink="/admin/users" class="btn btn-link w-100 mt-2">{{ 'users.back' | translate }}</a>
  </div>
</div>
