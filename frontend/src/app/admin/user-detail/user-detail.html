<div class="d-flex justify-content-center align-items-center" style="min-height: 85vh; background-color: #f8f9fa;">
  <div class="card shadow p-4" style="width: 100%; max-width: 450px;" *ngIf="user">
    <div class="text-center mb-4">
      <i class="material-icons" style="font-size: 64px; color: #2c3e50;">account_circle</i>
      <h2 class="mt-2 mb-1">{{ user.username }}</h2>
      <span class="badge" [class.bg-primary]="user.role === 'admin'" [class.bg-secondary]="user.role !== 'admin'">
        {{ user.role }}
      </span>
    </div>

    <table class="table table-borderless mb-4">
      <tr><th>ID</th><td>{{ user.id }}</td></tr>
      <tr><th>Email</th><td>{{ user.email }}</td></tr>
      <tr><th>Role</th><td>{{ user.role }}</td></tr>
    </table>

    <div class="d-flex gap-2">
      <a [routerLink]="['/admin/users', user.id, 'edit']" class="btn btn-primary flex-fill">
        <i class="material-icons" style="font-size: 16px; vertical-align: middle;">edit</i> Edit
      </a>
      <button class="btn btn-outline-danger flex-fill" (click)="deleteUser()">
        <i class="material-icons" style="font-size: 16px; vertical-align: middle;">delete</i> Delete
      </button>
    </div>

    <a routerLink="/admin/users" class="btn btn-outline-secondary btn-sm w-100 mt-3">
      <i class="material-icons" style="font-size: 16px; vertical-align: middle;">arrow_back</i> Back to All Users
    </a>
  </div>
</div>
