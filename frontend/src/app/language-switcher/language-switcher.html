<div class="pill-switch" role="group" [attr.aria-label]="'lang.label' | translate" [style.--count]="languages.length" [style.--index]="activeIndex()">
  <span class="pill-indicator" aria-hidden="true"></span>
  <button
    *ngFor="let l of languages"
    type="button"
    class="pill-btn lang-btn"
    [class.active]="language.current() === l.code"
    [attr.aria-pressed]="language.current() === l.code"
    [attr.lang]="l.code"
    [attr.title]="'lang.' + l.code | translate"
    (click)="language.set(l.code)"
  >
    {{ l.label }}<span class="visually-hidden"> – {{ 'lang.' + l.code | translate }}</span>
  </button>
</div>
