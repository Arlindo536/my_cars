<div class="d-flex justify-content-center align-items-center" style="min-height: 85vh; background-color: #f8f9fa;">
  <div class="card shadow p-4" style="width: 100%; max-width: 420px;">
    <h2 class="mb-4 text-center">Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <input formControlName="username" class="form-control" placeholder="Username" />
      </div>
      <div class="mb-3">
        <input formControlName="password" type="password" class="form-control" placeholder="Password" />
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">Login</button>
    </form>
    <p class="mt-3 text-center">Don't have an account? <a routerLink="/auth/register">Register here</a></p>
  </div>
</div>
