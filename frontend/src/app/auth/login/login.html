<app-auth-layout [heading]="'auth.loginTitle' | translate">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="mb-3">
      <div class="form-floating">
        <input id="login-username" formControlName="username" class="form-control" autocomplete="username" placeholder=" "
          [attr.aria-invalid]="showError('username')" aria-describedby="login-username-error" />
        <label for="login-username">{{ 'auth.username' | translate }}</label>
      </div>
      <app-field-error [control]="loginForm.get('username')" errorId="login-username-error"></app-field-error>
    </div>
    <div class="mb-4">
      <div class="form-floating password-wrap">
        <input #pw id="login-password" formControlName="password" type="password" class="form-control" autocomplete="current-password" placeholder=" "
          [attr.aria-invalid]="showError('password')" aria-describedby="login-password-error" />
        <label for="login-password">{{ 'auth.password' | translate }}</label>
        <button [appPasswordToggle]="pw"></button>
      </div>
      <app-field-error [control]="loginForm.get('password')" errorId="login-password-error"></app-field-error>
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="submitting()" [class.is-loading]="submitting()" [attr.aria-busy]="submitting()">
      {{ (submitting() ? 'auth.submitting' : 'auth.loginSubmit') | translate }}
    </button>
  </form>

  <p class="mt-4 mb-0">{{ 'auth.noAccount' | translate }} <a routerLink="/auth/register">{{ 'auth.registerHere' | translate }}</a></p>

  <!-- Public demo logins (production only): next to the form, never inside the artwork -->
  <div *ngIf="demoAccounts.length" class="demo-box mt-4">
    <h2 class="h6 mb-1">{{ 'demo.title' | translate }}</h2>
    <p class="small text-muted mb-2">{{ 'demo.text' | translate }}</p>
    <div class="d-flex gap-2">
      <button *ngFor="let a of demoAccounts" type="button" class="btn btn-dark btn-sm flex-fill" [disabled]="submitting()" (click)="loginAsDemo(a)">
        {{ (a.role === 'admin' ? 'demo.admin' : 'demo.customer') | translate }}
      </button>
    </div>
    <p class="small text-muted mt-2 mb-0">
      <span *ngFor="let a of demoAccounts; let last = last"><code>{{ a.username }}</code> / <code>{{ a.password }}</code><br *ngIf="!last" /></span>
    </p>
  </div>
</app-auth-layout>
