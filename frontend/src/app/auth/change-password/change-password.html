<div class="d-flex justify-content-center align-items-center py-5" style="min-height: 70vh;">
  <div class="card shadow-sm p-4" style="width: 100%; max-width: 440px;">
    <h1 class="h2 mb-4 text-center">{{ 'profile.changePassword' | translate }}</h1>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="cp-old" class="form-label">{{ 'profile.currentPassword' | translate }}</label>
        <input id="cp-old" formControlName="old_password" type="password" class="form-control" autocomplete="current-password" />
      </div>
      <div class="mb-3">
        <label for="cp-new" class="form-label">{{ 'profile.newPassword' | translate }}</label>
        <input id="cp-new" formControlName="new_password" type="password" class="form-control" autocomplete="new-password" />
      </div>
      <div class="mb-3">
        <label for="cp-confirm" class="form-label">{{ 'profile.confirmNewPassword' | translate }}</label>
        <input id="cp-confirm" formControlName="confirm_new_password" type="password" class="form-control" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid">{{ 'profile.changePassword' | translate }}</button>
    </form>
    <a routerLink="/auth/profile" class="btn btn-link w-100 mt-2">{{ 'profile.back' | translate }}</a>
  </div>
</div>
