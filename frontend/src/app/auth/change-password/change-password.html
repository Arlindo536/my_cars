<div class="d-flex justify-content-center align-items-center" style="min-height: 85vh; background-color: #f8f9fa;">
  <div class="card shadow p-4" style="width: 100%; max-width: 420px;">
    <h2 class="mb-4 text-center">Change Password</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <input formControlName="old_password" type="password" class="form-control" placeholder="Current Password" />
      </div>
      <div class="mb-3">
        <input formControlName="new_password" type="password" class="form-control" placeholder="New Password" />
      </div>
      <div class="mb-3">
        <input formControlName="confirm_new_password" type="password" class="form-control" placeholder="Confirm New Password" />
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid">Change Password</button>
    </form>
  </div>
</div>
