<div class="d-flex justify-content-center align-items-center" style="min-height: 85vh; background-color: #f8f9fa;">
  <div class="card shadow p-4" style="width: 100%; max-width: 420px;">
    <h2 class="mb-4 text-center">{{ 'auth.registerTitle' | translate }}</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="reg-username" class="form-label">{{ 'auth.username' | translate }}</label>
        <input id="reg-username" formControlName="username" type="text" class="form-control" autocomplete="username" />
      </div>
      <div class="mb-3">
        <label for="reg-password" class="form-label">{{ 'auth.password' | translate }}</label>
        <input id="reg-password" formControlName="password" type="password" class="form-control" autocomplete="new-password" />
      </div>
      <div class="mb-3">
        <label for="reg-confirm_password" class="form-label">{{ 'auth.confirmPassword' | translate }}</label>
        <input id="reg-confirm_password" formControlName="confirm_password" type="password" class="form-control" autocomplete="new-password" />
      </div>
      <div class="mb-3">
        <label for="reg-email" class="form-label">{{ 'auth.email' | translate }}</label>
        <input id="reg-email" formControlName="email" type="email" class="form-control" autocomplete="email" />
      </div>
      <div class="mb-3">
        <label for="reg-first_name" class="form-label">{{ 'auth.firstName' | translate }}</label>
        <input id="reg-first_name" formControlName="first_name" type="text" class="form-control" autocomplete="given-name" />
      </div>
      <div class="mb-3">
        <label for="reg-last_name" class="form-label">{{ 'auth.lastName' | translate }}</label>
        <input id="reg-last_name" formControlName="last_name" type="text" class="form-control" autocomplete="family-name" />
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="registerForm.invalid">{{ 'auth.registerSubmit' | translate }}</button>
    </form>
    <p class="mt-3 text-center">{{ 'auth.haveAccount' | translate }} <a routerLink="/auth/login">{{ 'auth.loginHere' | translate }}</a></p>
  </div>
</div>
