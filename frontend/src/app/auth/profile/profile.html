<div class="d-flex justify-content-center align-items-center" style="min-height: 85vh; background-color: #f8f9fa;">
  <div class="card shadow p-4" style="width: 100%; max-width: 420px;">
    <h2 class="mb-4 text-center">My Profile</h2>
    <div *ngIf="profile">
      <p><strong>Username:</strong> {{ profile.username }}</p>
      <p><strong>Email:</strong> {{ profile.email }}</p>
      <p><strong>First Name:</strong> {{ profile.first_name }}</p>
      <p><strong>Last Name:</strong> {{ profile.last_name }}</p>
      <p><strong>Role:</strong> {{ profile.role }}</p>
    </div>
    <a routerLink="/auth/update-profile" class="btn btn-primary w-100 mt-3">Edit Profile</a>
    <a routerLink="/auth/change-password" class="btn btn-outline-secondary w-100 mt-2">Change Password</a>
    <button class="btn btn-outline-danger w-100 mt-2" (click)="deleteAccount()">
      <i class="material-icons" style="font-size: 16px; vertical-align: middle;">delete_forever</i>
      Delete My Account
    </button>
  </div>
</div>
