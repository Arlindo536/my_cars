<div class="map-wrap">
  <div #mapEl class="map" role="region" [attr.aria-label]="'map.aria' | translate: { address: office.address }"></div>
  <div class="map-info">
    <p class="map-address mb-1">{{ office.address }}</p>
    <p class="mb-0 small">
      <a [href]="mapUrl" target="_blank" rel="noopener">{{ 'map.open' | translate }}</a>
      <span aria-hidden="true"> · </span>
      <a [href]="directionsUrl" target="_blank" rel="noopener">{{ 'map.directions' | translate }}</a>
    </p>
  </div>
</div>
