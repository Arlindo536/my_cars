<header class="site-header">
  <nav class="container-xl d-flex flex-wrap align-items-center py-2" aria-label="Navigimi kryesor">
    <a class="brand" routerLink="/" (click)="menuOpen = false">
      <span class="brand-mark" aria-hidden="true"><i class="material-icons">directions_car</i></span>
      <span class="brand-text">My<span class="text-accent">Cars</span></span>
    </a>

    <button
      type="button"
      class="menu-toggle d-md-none ms-auto"
      [attr.aria-expanded]="menuOpen"
      aria-controls="main-menu"
      (click)="menuOpen = !menuOpen"
    >
      <i class="material-icons" aria-hidden="true">{{ menuOpen ? 'close' : 'menu' }}</i>
      <span class="visually-hidden">Menuja</span>
    </button>

    <div id="main-menu" class="menu ms-md-auto" [class.open]="menuOpen" (click)="closeMenu($event)">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link-item">Makinat me qira</a>
      <ng-container *ngIf="isLoggedIn">
        <ng-container *ngIf="role === 'customer'">
          <a routerLink="/cars" routerLinkActive="active" class="nav-link-item">Makinat e mia</a>
          <a routerLink="/auth/profile" routerLinkActive="active" class="nav-link-item">Profili</a>
        </ng-container>
        <ng-container *ngIf="role === 'admin'">
          <a routerLink="/admin/users" routerLinkActive="active" class="nav-link-item">Përdoruesit</a>
          <a routerLink="/admin/cars" routerLinkActive="active" class="nav-link-item">Flota (admin)</a>
        </ng-container>
        <button type="button" class="btn btn-outline-light btn-sm nav-cta" (click)="logout()">
          <i class="material-icons" aria-hidden="true">logout</i> Dil
        </button>
      </ng-container>

      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/auth/login" routerLinkActive="active" class="nav-link-item">Hyr</a>
        <a routerLink="/auth/register" class="btn btn-primary btn-sm nav-cta">Regjistrohu</a>
      </ng-container>
    </div>
  </nav>
</header>
