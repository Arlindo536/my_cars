# Serves the Angular build and forwards API, media and Django admin requests to the backend.
# TLS is terminated by the reverse proxy in front of this container (see README, "Deployment").

# Keep the scheme the outer proxy saw, so Django builds https:// URLs
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Car photos are limited to 5 MB by the backend
    client_max_body_size 6m;

    # Re-resolve "backend" through the container DNS so a restarted backend
    # (new IP) is found without restarting nginx
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Security headers for the app shell (repeated in locations that set their own headers).
    # Cloudflare Web Analytics (enabled on the zone) injects its beacon: allowed explicitly.
    set $csp "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /django-admin/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # collectstatic output (Django admin assets), shared via a volume.
    # ^~ keeps the regex location for .css/.js/.jpg below from taking these requests
    location ^~ /static/ {
        alias /srv/static/;
        expires 7d;
    }

    # Uploaded car photos (always re-encoded JPEGs), shared via a volume
    location ^~ /media/ {
        alias /srv/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
    }

    # Translations change with deployments but keep their names
    location /i18n/ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Hashed build files never change
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Angular routes: everything else is the app shell
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
